<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 560" role="img" aria-labelledby="title desc">
  <title id="title">Automation and systems integration visual</title>
  <desc id="desc">A simplified abstract visual for a private legal accounting automation and systems integration project.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#14213d"/>
      <stop offset="0.55" stop-color="#126782"/>
      <stop offset="1" stop-color="#0b6e4f"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eefdfa"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#06111f" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect width="920" height="560" rx="28" fill="url(#bg)"/>
  <circle cx="760" cy="90" r="120" fill="#ffd166" opacity="0.18"/>
  <circle cx="138" cy="472" r="154" fill="#7dd3fc" opacity="0.13"/>

  <text x="64" y="82" fill="#ffffff" font-family="Arial, sans-serif" font-size="30" font-weight="700">Automation &amp; Integration</text>
  <text x="64" y="120" fill="#d8fffb" font-family="Arial, sans-serif" font-size="18">Private workflow systems for accounting operations</text>

  <g filter="url(#shadow)">
    <rect x="74" y="190" width="210" height="150" rx="18" fill="url(#panel)"/>
    <circle cx="142" cy="253" r="34" fill="#dbeafe"/>
    <path d="M126 254h32M142 238v32" stroke="#2563eb" stroke-width="8" stroke-linecap="round"/>
    <text x="104" y="316" fill="#132238" font-family="Arial, sans-serif" font-size="24" font-weight="700">Systems</text>

    <rect x="356" y="166" width="210" height="198" rx="20" fill="url(#panel)"/>
    <rect x="410" y="218" width="102" height="20" rx="10" fill="#0f766e"/>
    <rect x="394" y="258" width="134" height="20" rx="10" fill="#5eead4"/>
    <rect x="422" y="298" width="78" height="20" rx="10" fill="#14b8a6"/>
    <text x="391" y="342" fill="#132238" font-family="Arial, sans-serif" font-size="24" font-weight="700">Automation</text>

    <rect x="636" y="190" width="210" height="150" rx="18" fill="url(#panel)"/>
    <circle cx="704" cy="253" r="34" fill="#dcfce7"/>
    <path d="m687 253 12 13 26-30" fill="none" stroke="#16a34a" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="686" y="316" fill="#132238" font-family="Arial, sans-serif" font-size="24" font-weight="700">Review</text>

    <rect x="212" y="410" width="496" height="72" rx="18" fill="#ffffff" opacity="0.94"/>
    <text x="292" y="456" fill="#132238" font-family="Arial, sans-serif" font-size="25" font-weight="700">Approved Accounting Handoff</text>
  </g>

  <path d="M284 265h72" stroke="#d8fffb" stroke-width="8" stroke-linecap="round"/>
  <path d="m344 242 25 23-25 23" fill="none" stroke="#d8fffb" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M566 265h70" stroke="#d8fffb" stroke-width="8" stroke-linecap="round"/>
  <path d="m624 242 25 23-25 23" fill="none" stroke="#d8fffb" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M460 364v46" stroke="#d8fffb" stroke-width="8" stroke-linecap="round"/>
  <path d="m438 398 22 25 22-25" fill="none" stroke="#d8fffb" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
